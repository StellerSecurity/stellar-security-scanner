# Generic source-only scanner; repository code is data.
name: Shared repository source check
on:
  workflow_call:
permissions:
  contents: read
  checks: write
  statuses: write
jobs:
  scan:
    name: Repository source guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record resolved shared scanner identity
        env:
          STELLAR_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          STELLAR_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          STELLAR_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          STELLAR_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        shell: bash
        run: |
          python3 -I -B - <<'STELLAR_SHARED_IDENTITY_PY'
          import json, os, re
          keys = ('REPOSITORY', 'REF', 'SHA', 'FILE_PATH')
          value = {key.lower(): os.environ.get('STELLAR_JOB_WORKFLOW_' + key, '') for key in keys}
          if value['repository'] != 'StellerSecurity/stellar-security-scanner': raise SystemExit(2)
          if value['ref'] != 'StellerSecurity/stellar-security-scanner/.github/workflows/source-check.yml@refs/heads/main': raise SystemExit(2)
          if value['file_path'] != '.github/workflows/source-check.yml': raise SystemExit(2)
          if not re.fullmatch(r'[0-9a-f]{40}', value['sha']) or value['sha'] == '0' * 40: raise SystemExit(2)
          repository = os.environ.get('GITHUB_REPOSITORY', '')
          if not re.fullmatch(r"(?:StellerSecurity|Stellar-seo-websites|StellarMail|StellarSecurity-Packages)/[A-Za-z0-9_.-]{1,100}", repository): raise SystemExit(2)
          if not re.fullmatch(r'[1-9][0-9]{0,19}', os.environ.get('GITHUB_REPOSITORY_ID', '')): raise SystemExit(2)
          value['caller_contract'] = 'stellar-shared-main-v1'
          print('STELLAR_SHARED_WORKFLOW_IDENTITY='+ json.dumps(value, sort_keys=True, separators=(',', ':')), flush=True)
          STELLAR_SHARED_IDENTITY_PY
      - name: Read source and lifecycle scripts
        env:
          STELLAR_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          STELLAR_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          STELLAR_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          STELLAR_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I -B - <<'STELLAR_GUARD_PY'
          import base64, hashlib, zlib
          encoded = ''
          stream = zlib.decompressobj()
          source = stream.decompress(base64.b64decode(encoded, validate=True), 39365)
          if len(source) != 39364 or not stream.eof or stream.unused_data or stream.unconsumed_tail or hashlib.sha256(source).hexdigest() != '065e9b91bda86fa63ee2e5c9ae3a5754e5a1d49c914670cab24f3598f1a65481':
              raise RuntimeError('Reviewed source bytes differ')
          exec(compile(source, 'stellar_source_guard.py', 'exec'), {'__name__': '__main__'})
          STELLAR_GUARD_PY
