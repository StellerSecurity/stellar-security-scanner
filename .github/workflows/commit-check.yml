      - name: Verify and materialize reviewed scanner modules
        shell: bash
        run: |
          python3 -I -B - <<'STELLAR_RELEASE_PY'
          import base64, hashlib, json, os, pathlib, zlib
          root = pathlib.Path(os.environ['STELLAR_RELEASE_DIR'])
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          if root.is_symlink() or root.parent.resolve() != temporary or not root.name.startswith('stellar-commit-release-'): raise SystemExit(2)
          pins = {'package_guard.py': '1d6498acf0d81ccfc5f1fd0c05cd7ad8460f5793c395c31e268e50f31e4d68a8', 'package_acquisition.py': '57564ba042272bfff3c0fa409d873542cab437975c169e7d3e3e1ef269a2281c', 'content_guard.py': '10934e71eedf1b6cc1a7f6a45f0529b3eda889b50174548dd73e0b01218e5603', 'source_guard_v2.py': '065e9b91bda86fa63ee2e5c9ae3a5754e5a1d49c914670cab24f3598f1a65481', 'malware_advisories.py': 'e5b69b6a60e71a107cf0c07ae760a8f652fae4dbab12a1059147abbf7778f8ab', 'manifest_bridge.py': '4401864f2a37159d642bdb76bf8db78ecb649320e922024bfbfef5e9fcd6532b', 'dependency_worker.py': '03fc3ffb1d3163aac141b3d919681467e6b72239e07177223df2de42611673e7', 'legacy_worker.py': '52c73fa0dc67b5cd42c54a3f258423210192627f724d324a8c129089d67cee67', 'pushover_notify.py': '3ca5e64270e80c5f14135a2bccfec2f0db3cbaa6b981f909abe7e6b330f8e80c', 'source_guard.py': '11e078fea6906227514ef553bd77e00e69e746028ee805e99d7696ba244c90fe'}
          module_pins = {'package_guard.py': '1d6498acf0d81ccfc5f1fd0c05cd7ad8460f5793c395c31e268e50f31e4d68a8', 'package_acquisition.py': '57564ba042272bfff3c0fa409d873542cab437975c169e7d3e3e1ef269a2281c', 'content_guard.py': '10934e71eedf1b6cc1a7f6a45f0529b3eda889b50174548dd73e0b01218e5603', 'source_guard_v2.py': '065e9b91bda86fa63ee2e5c9ae3a5754e5a1d49c914670cab24f3598f1a65481', 'malware_advisories.py': 'e5b69b6a60e71a107cf0c07ae760a8f652fae4dbab12a1059147abbf7778f8ab', 'manifest_bridge.py': '4401864f2a37159d642bdb76bf8db78ecb649320e922024bfbfef5e9fcd6532b', 'dependency_worker.py': '03fc3ffb1d3163aac141b3d919681467e6b72239e07177223df2de42611673e7', 'legacy_worker.py': '52c73fa0dc67b5cd42c54a3f258423210192627f724d324a8c129089d67cee67', 'pushover_notify.py': '3ca5e64270e80c5f14135a2bccfec2f0db3cbaa6b981f909abe7e6b330f8e80c'}
          parts = []
          for index in range(30):
              path = root / ('chunk-%03d' % index)
              if path.is_symlink() or not path.is_file() or not 1 <= path.stat().st_size <= 12000: raise SystemExit(2)
              parts.append(path.read_bytes())
          encoded = b''.join(parts)
          if len(encoded) != 355916: raise SystemExit(2)
          packed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(packed).hexdigest() != '91207f812b7396fc4373cee56f1b00f7249c7ca35e8476f158315d2ac3dcc43c': raise SystemExit(2)
          inflater = zlib.decompressobj()
          raw = inflater.decompress(packed, 939572)
          if len(raw) != 939571 or not inflater.eof or inflater.unused_data or inflater.unconsumed_tail: raise SystemExit(2)
          if hashlib.sha256(raw).hexdigest() != 'cc4b9547d9add99122478901b7d837c1c157058fe7ca74f6cfde42d69015c947': raise SystemExit(2)
          bundle = json.loads(raw)
          if set(bundle) != set(pins): raise SystemExit(2)
          verified = {}
          for name, pin in pins.items():
              item = bundle[name]
              if item.get('sha256') != pin: raise SystemExit(2)
              data = base64.b64decode(item['base64'], validate=True)
              if hashlib.sha256(data).hexdigest() != pin: raise SystemExit(2)
              verified[name] = data
          for name, data in verified.items():
              with (root / name).open('xb') as output: output.write(data)
          with (root / 'pins.json').open('x') as output: output.write(json.dumps(module_pins, sort_keys=True))
          STELLAR_RELEASE_PY
