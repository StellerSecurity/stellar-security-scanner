          module_pins = {'package_guard.py': '2a40eadbc00caac5c820169644cda0220d0eab833ac5e0191a146654d02dd207', 'package_acquisition.py': 'af1e8dbd155248134f930ff645e497dc1dac65ccd8b315f32c39b27f11729071', 'content_guard.py': '5bbf28c7fdbf4cfe40870bdafa005ea413d29c72d201f2ab2469f9d607ce7394', 'source_guard_v2.py': '065e9b91bda86fa63ee2e5c9ae3a5754e5a1d49c914670cab24f3598f1a65481', 'malware_advisories.py': 'e5b69b6a60e71a107cf0c07ae760a8f652fae4dbab12a1059147abbf7778f8ab', 'manifest_bridge.py': '9e295ddaa294c9c0a22809eedfb4cde8b54bb71f4ece01ed165d840a50b7a758', 'dependency_worker.py': 'bb73a158f91023a8768ac78fcedc123bf9aa691bffe65dd39126985381f87941', 'legacy_worker.py': '52c73fa0dc67b5cd42c54a3f258423210192627f724d324a8c129089d67cee67', 'pushover_notify.py': '3ca5e64270e80c5f14135a2bccfec2f0db3cbaa6b981f909abe7e6b330f8e80c'}
