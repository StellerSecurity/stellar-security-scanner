          inflater = zlib.decompressobj()
          raw = inflater.decompress(packed, 340400)
          if len(raw) != 340399 or not inflater.eof or inflater.unused_data or inflater.unconsumed_tail: raise SystemExit(2)
          if hashlib.sha256(raw).hexdigest() != '810c4510f017457255a152c74a132c2e2d87dbc20e7205cc7641b84e376795e7': raise SystemExit(2)
          bundle = json.loads(raw)
          if set(bundle) != set(pins): raise SystemExit(2)
          verified = {}
          for name, pin in pins.items():
              item = bundle[name]
