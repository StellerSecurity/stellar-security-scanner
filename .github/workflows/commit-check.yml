      - name: Verify and materialize reviewed scanner modules
        shell: bash
        run: |
          python3 -I -B - <<'STELLAR_RELEASE_PY'
          import base64, hashlib, json, os, pathlib, zlib
          root = pathlib.Path(os.environ['STELLAR_RELEASE_DIR'])
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          if root.is_symlink() or root.parent.resolve() != temporary or not root.name.startswith('stellar-commit-release-'): raise SystemExit(2)
          pins = {'package_guard.py': 'fd701627459dc693a5548d090093fed836b309dd9d309bbbdf6d1442b0682c9b', 'package_acquisition.py': 'd7f2972f046aa567e386db837656a84811d113c0a912bdce4c14e32daa0aaf9a', 'content_guard.py': '8f90e3470db60cc81e455328a9cd01d6b20c47da4dcf074b5088633290bb167d', 'source_guard_v2.py': 'db4cc41a36aad99a66352e0e944aa6bc24016e1f28107bb04d252c2a9ff3e6da', 'malware_advisories.py': 'e5cc13300d86ad83dd2144ee8e0f6e8aa48a431236d65e201936c8f1b8d1f261', 'manifest_bridge.py': 'e36a1262259e9b668e9ac9b2b676c37a77e24c2a7793e6fb23ee622c2ec795f9', 'dependency_worker.py': 'bfd122bddeda3c5661a775dd6a396e033c8b2b7046e9386c8b05669a61096a53', 'legacy_worker.py': '5ceaa6f017f8a3570f88094f2ef46ced7d914e7e3e5b927f6cbccbf8dbb7be9e', 'pushover_notify.py': '3ca5e64270e80c5f14135a2bccfec2f0db3cbaa6b981f909abe7e6b330f8e80c', 'source_guard.py': 'd44f5fcf1f70c2239cb60352b43d29691dab865fb25ea9eaf6f7f9afa80375b4'}
          module_pins = {'package_guard.py': 'fd701627459dc693a5548d090093fed836b309dd9d309bbbdf6d1442b0682c9b', 'package_acquisition.py': 'd7f2972f046aa567e386db837656a84811d113c0a912bdce4c14e32daa0aaf9a', 'content_guard.py': '8f90e3470db60cc81e455328a9cd01d6b20c47da4dcf074b5088633290bb167d', 'source_guard_v2.py': 'db4cc41a36aad99a66352e0e944aa6bc24016e1f28107bb04d252c2a9ff3e6da', 'malware_advisories.py': 'e5cc13300d86ad83dd2144ee8e0f6e8aa48a431236d65e201936c8f1b8d1f261', 'manifest_bridge.py': 'e36a1262259e9b668e9ac9b2b676c37a77e24c2a7793e6fb23ee622c2ec795f9', 'dependency_worker.py': 'bfd122bddeda3c5661a775dd6a396e033c8b2b7046e9386c8b05669a61096a53', 'legacy_worker.py': '5ceaa6f017f8a3570f88094f2ef46ced7d914e7e3e5b927f6cbccbf8dbb7be9e', 'pushover_notify.py': '3ca5e64270e80c5f14135a2bccfec2f0db3cbaa6b981f909abe7e6b330f8e80c'}
          parts = []
          for index in range(13):
              path = root / ('chunk-%03d' % index)
              if path.is_symlink() or not path.is_file() or not 1 <= path.stat().st_size <= 12000: raise SystemExit(2)
              parts.append(path.read_bytes())
          encoded = b''.join(parts)
          if len(encoded) != 150168: raise SystemExit(2)
          packed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(packed).hexdigest() != '195f057662f8b95bb6807f76aeb3d8777d1f019759129cfd8e6548e31e699483': raise SystemExit(2)
          inflater = zlib.decompressobj()
          raw = inflater.decompress(packed, 366736)
          if len(raw) != 366735 or not inflater.eof or inflater.unused_data or inflater.unconsumed_tail: raise SystemExit(2)
          if hashlib.sha256(raw).hexdigest() != '23d0218627e3977a7a2104e79495c4f03113923a5d4cd70567aabc6ac26f659d': raise SystemExit(2)
          bundle = json.loads(raw)
          if set(bundle) != set(pins): raise SystemExit(2)
          verified = {}
          for name, pin in pins.items():
              item = bundle[name]
              if item.get('sha256') != pin: raise SystemExit(2)
              data = base64.b64decode(item['base64'], validate=True)
              if hashlib.sha256(data).hexdigest() != pin: raise SystemExit(2)
              verified[name] = data
          for name, data in verified.items():
              with (root / name).open('xb') as output: output.write(data)
          with (root / 'pins.json').open('x') as output: output.write(json.dumps(module_pins, sort_keys=True))
          STELLAR_RELEASE_PY
      - name: Read exact commit and inspect source and lifecycle scripts
        id: scan
        env:
          STELLAR_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          STELLAR_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          STELLAR_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          STELLAR_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I -B - <<'STELLAR_RELEASE_PY'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['STELLAR_RELEASE_DIR'])
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          if root.is_symlink() or root.parent.resolve() != temporary or not root.name.startswith('stellar-commit-release-'): raise SystemExit(2)
          pins = {'package_guard.py': 'fd701627459dc693a5548d090093fed836b309dd9d309bbbdf6d1442b0682c9b', 'package_acquisition.py': 'd7f2972f046aa567e386db837656a84811d113c0a912bdce4c14e32daa0aaf9a', 'content_guard.py': '8f90e3470db60cc81e455328a9cd01d6b20c47da4dcf074b5088633290bb167d', 'source_guard_v2.py': 'db4cc41a36aad99a66352e0e944aa6bc24016e1f28107bb04d252c2a9ff3e6da', 'malware_advisories.py': 'e5cc13300d86ad83dd2144ee8e0f6e8aa48a431236d65e201936c8f1b8d1f261', 'manifest_bridge.py': 'e36a1262259e9b668e9ac9b2b676c37a77e24c2a7793e6fb23ee622c2ec795f9', 'dependency_worker.py': 'bfd122bddeda3c5661a775dd6a396e033c8b2b7046e9386c8b05669a61096a53', 'legacy_worker.py': '5ceaa6f017f8a3570f88094f2ef46ced7d914e7e3e5b927f6cbccbf8dbb7be9e', 'pushover_notify.py': '3ca5e64270e80c5f14135a2bccfec2f0db3cbaa6b981f909abe7e6b330f8e80c', 'source_guard.py': 'd44f5fcf1f70c2239cb60352b43d29691dab865fb25ea9eaf6f7f9afa80375b4'}
          module_pins = {'package_guard.py': 'fd701627459dc693a5548d090093fed836b309dd9d309bbbdf6d1442b0682c9b', 'package_acquisition.py': 'd7f2972f046aa567e386db837656a84811d113c0a912bdce4c14e32daa0aaf9a', 'content_guard.py': '8f90e3470db60cc81e455328a9cd01d6b20c47da4dcf074b5088633290bb167d', 'source_guard_v2.py': 'db4cc41a36aad99a66352e0e944aa6bc24016e1f28107bb04d252c2a9ff3e6da', 'malware_advisories.py': 'e5cc13300d86ad83dd2144ee8e0f6e8aa48a431236d65e201936c8f1b8d1f261', 'manifest_bridge.py': 'e36a1262259e9b668e9ac9b2b676c37a77e24c2a7793e6fb23ee622c2ec795f9', 'dependency_worker.py': 'bfd122bddeda3c5661a775dd6a396e033c8b2b7046e9386c8b05669a61096a53', 'legacy_worker.py': '5ceaa6f017f8a3570f88094f2ef46ced7d914e7e3e5b927f6cbccbf8dbb7be9e', 'pushover_notify.py': '3ca5e64270e80c5f14135a2bccfec2f0db3cbaa6b981f909abe7e6b330f8e80c'}
          verified = {}
          for name, pin in pins.items():
              path = root / name
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 2000000: raise SystemExit(2)
              raw = path.read_bytes()
              if hashlib.sha256(raw).hexdigest() != pin: raise SystemExit(2)
              verified[name] = raw
          pin_file = root / 'pins.json'
          if pin_file.is_symlink() or pin_file.stat().st_size > 10000 or json.loads(pin_file.read_bytes()) != module_pins: raise SystemExit(2)
          names = {'GITHUB_EVENT_NAME','GITHUB_EVENT_PATH','GITHUB_REPOSITORY','GITHUB_REPOSITORY_ID','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_OUTPUT','GITHUB_STEP_SUMMARY','GH_TOKEN','STELLAR_JOB_WORKFLOW_REPOSITORY','STELLAR_JOB_WORKFLOW_REF','STELLAR_JOB_WORKFLOW_SHA','STELLAR_JOB_WORKFLOW_FILE_PATH'}
          env = {name:os.environ[name] for name in names if name in os.environ}
          env.update(PATH=os.defpath, PYTHONIOENCODING='utf-8')
          result = subprocess.run([sys.executable,'-I','-B','-c',"import hashlib,pathlib,sys\nraw=sys.stdin.buffer.read(2000001)\nif len(raw)>2000000 or hashlib.sha256(raw).hexdigest()!=sys.argv[1]:raise SystemExit(2)\nfilename=sys.argv[2];sys.argv=sys.argv[2:]\nexec(compile(raw,filename,'exec',dont_inherit=True),{'__name__':'__main__','__file__':filename})\n",pins['legacy_worker.py'],str(root/'legacy_worker.py'),'scan'],input=verified['legacy_worker.py'],cwd=str(root),env=env,timeout=2400,check=False)
          raise SystemExit(result.returncode)
          STELLAR_RELEASE_PY
