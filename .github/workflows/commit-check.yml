        shell: bash
        run: |
          python3 -I -B - <<'STELLAR_RELEASE_PY'
          import os, pathlib, tempfile
          root = pathlib.Path(tempfile.mkdtemp(prefix='stellar-commit-release-', dir=os.environ['RUNNER_TEMP']))
