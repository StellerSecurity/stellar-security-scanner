# Generic source and static dependency-content worker. No checkout.
name: Shared repository commit check
on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string
    secrets:
      PUSHOVER_APP_TOKEN:
        required: false
      PUSHOVER_USER_KEY:
        required: false
permissions:
  contents: read
  checks: write
jobs:
  scan:
    name: Repository commit guard execution
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Record resolved shared scanner identity
        env:
          STELLAR_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          STELLAR_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          STELLAR_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          STELLAR_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        shell: bash
        run: |
          python3 -I -B - <<'STELLAR_SHARED_IDENTITY_PY'
          import json, os, re
          keys = ('REPOSITORY', 'REF', 'SHA', 'FILE_PATH')
          value = {key.lower(): os.environ.get('STELLAR_JOB_WORKFLOW_' + key, '') for key in keys}
          if value['repository'] != 'StellerSecurity/stellar-security-scanner': raise SystemExit(2)
          if value['ref'] != 'StellerSecurity/stellar-security-scanner/.github/workflows/commit-check.yml@refs/heads/main': raise SystemExit(2)
          if value['file_path'] != '.github/workflows/commit-check.yml': raise SystemExit(2)
          if not re.fullmatch(r'[0-9a-f]{40}', value['sha']) or value['sha'] == '0' * 40: raise SystemExit(2)
          repository = os.environ.get('GITHUB_REPOSITORY', '')
          if not re.fullmatch(r"(?:StellerSecurity|Stellar-seo-websites|StellarMail|StellarSecurity-Packages)/[A-Za-z0-9_.-]{1,100}", repository): raise SystemExit(2)
          if not re.fullmatch(r'[1-9][0-9]{0,19}', os.environ.get('GITHUB_REPOSITORY_ID', '')): raise SystemExit(2)
          value['caller_contract'] = 'stellar-shared-main-v1'
          print('STELLAR_SHARED_WORKFLOW_IDENTITY='+ json.dumps(value, sort_keys=True, separators=(',', ':')), flush=True)
          STELLAR_SHARED_IDENTITY_PY
