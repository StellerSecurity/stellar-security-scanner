          module_pins = {'package_guard.py': '283ffc1c8d436b2f4777a6b55542e5f63aee368b066bd375f3237e1f4035b732', 'package_acquisition.py': '1195d51d98c7703b94cd35d373c7c809eeef1d148c784a590d51031703d0dc83', 'content_guard.py': '9ecdc6cb7cebfb3562773299fe8333ab637a9babf7441346c517329cd7dcb5bb', 'source_guard_v2.py': 'bf8f1ae7afe74df2ba7db41c2304b6ff499a02026a55c98333d0594338986908', 'malware_advisories.py': 'c6bdf98479a5aea3a66bf01b6f473f1d6961dd04230da29890e7cf24061c70a9', 'manifest_bridge.py': 'aacc4ef3028f67b0b28585e7db108b693e2c819336c945108479e0d0cb2f8a96', 'dependency_worker.py': 'df4351c3be715ecbee121842c8b811b0a3dc12295d7c466d15526b4c681b763b', 'legacy_worker.py': '5ceaa6f017f8a3570f88094f2ef46ced7d914e7e3e5b927f6cbccbf8dbb7be9e', 'pushover_notify.py': '3ca5e64270e80c5f14135a2bccfec2f0db3cbaa6b981f909abe7e6b330f8e80c'}
          parts = []
          for index in range(12):
              path = root / ('chunk-%03d' % index)
              if path.is_symlink() or not path.is_file() or not 1 <= path.stat().st_size <= 12000: raise SystemExit(2)
              parts.append(path.read_bytes())
          encoded = b''.join(parts)
