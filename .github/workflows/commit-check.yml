              raw = path.read_bytes()
              if hashlib.sha256(raw).hexdigest() != pin: raise SystemExit(2)
              verified[name] = raw
          pin_file = root / 'pins.json'
          if pin_file.is_symlink() or pin_file.stat().st_size > 10000 or json.loads(pin_file.read_bytes()) != module_pins: raise SystemExit(2)
          names = {'GITHUB_EVENT_NAME','GITHUB_EVENT_PATH','GITHUB_REPOSITORY','GITHUB_REPOSITORY_ID','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_OUTPUT','GITHUB_STEP_SUMMARY','GH_TOKEN','STELLAR_JOB_WORKFLOW_REPOSITORY','STELLAR_JOB_WORKFLOW_REF','STELLAR_JOB_WORKFLOW_SHA','STELLAR_JOB_WORKFLOW_FILE_PATH'}
          names.update({'SOURCE_GUARD_RESULT','DEPENDENCY_CONTENT_RESULT','PUSHOVER_APP_TOKEN','PUSHOVER_USER_KEY'})
          env = {name:os.environ[name] for name in names if name in os.environ}
          env.update(PATH=os.defpath, PYTHONIOENCODING='utf-8')
          result = subprocess.run([sys.executable,'-I','-B','-c',"import hashlib,pathlib,sys\nraw=sys.stdin.buffer.read(2000001)\nif len(raw)>2000000 or hashlib.sha256(raw).hexdigest()!=sys.argv[1]:raise SystemExit(2)\nfilename=sys.argv[2];sys.argv=sys.argv[2:]\nexec(compile(raw,filename,'exec',dont_inherit=True),{'__name__':'__main__','__file__':filename})\n",pins['dependency_worker.py'],str(root/'dependency_worker.py'),'notify',str(pin_file)],input=verified['dependency_worker.py'],cwd=str(root),env=env,timeout=1850,check=False)
          raise SystemExit(result.returncode)
          STELLAR_RELEASE_PY
