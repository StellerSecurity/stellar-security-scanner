      - name: Verify and materialize reviewed scanner modules
        shell: bash
        run: |
          python3 -I -B - <<'STELLAR_RELEASE_PY'
          import base64, hashlib, json, os, pathlib, zlib
          root = pathlib.Path(os.environ['STELLAR_RELEASE_DIR'])
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          if root.is_symlink() or root.parent.resolve() != temporary or not root.name.startswith('stellar-commit-release-'): raise SystemExit(2)
          pins = {'package_guard.py': 'd2f9891968fbf602169aa9d812c40023f7b33180edcb27d6fde38f6af7a327cc', 'package_acquisition.py': 'd7f2972f046aa567e386db837656a84811d113c0a912bdce4c14e32daa0aaf9a', 'content_guard.py': 'b5d5e021e2dd6d24fb2ba9e5070b094918895a2b12fed9784ebd8e919cb0e075', 'source_guard_v2.py': 'db4cc41a36aad99a66352e0e944aa6bc24016e1f28107bb04d252c2a9ff3e6da', 'malware_advisories.py': 'e5cc13300d86ad83dd2144ee8e0f6e8aa48a431236d65e201936c8f1b8d1f261', 'manifest_bridge.py': 'e36a1262259e9b668e9ac9b2b676c37a77e24c2a7793e6fb23ee622c2ec795f9', 'dependency_worker.py': 'f577d529ef8c516b28d8ec820d0b6e96328d4d2ee5aef3688e5b699805565076', 'legacy_worker.py': '5ceaa6f017f8a3570f88094f2ef46ced7d914e7e3e5b927f6cbccbf8dbb7be9e', 'pushover_notify.py': '3ca5e64270e80c5f14135a2bccfec2f0db3cbaa6b981f909abe7e6b330f8e80c', 'source_guard.py': 'd44f5fcf1f70c2239cb60352b43d29691dab865fb25ea9eaf6f7f9afa80375b4'}
          module_pins = {'package_guard.py': 'd2f9891968fbf602169aa9d812c40023f7b33180edcb27d6fde38f6af7a327cc', 'package_acquisition.py': 'd7f2972f046aa567e386db837656a84811d113c0a912bdce4c14e32daa0aaf9a', 'content_guard.py': 'b5d5e021e2dd6d24fb2ba9e5070b094918895a2b12fed9784ebd8e919cb0e075', 'source_guard_v2.py': 'db4cc41a36aad99a66352e0e944aa6bc24016e1f28107bb04d252c2a9ff3e6da', 'malware_advisories.py': 'e5cc13300d86ad83dd2144ee8e0f6e8aa48a431236d65e201936c8f1b8d1f261', 'manifest_bridge.py': 'e36a1262259e9b668e9ac9b2b676c37a77e24c2a7793e6fb23ee622c2ec795f9', 'dependency_worker.py': 'f577d529ef8c516b28d8ec820d0b6e96328d4d2ee5aef3688e5b699805565076', 'legacy_worker.py': '5ceaa6f017f8a3570f88094f2ef46ced7d914e7e3e5b927f6cbccbf8dbb7be9e', 'pushover_notify.py': '3ca5e64270e80c5f14135a2bccfec2f0db3cbaa6b981f909abe7e6b330f8e80c'}
          parts = []
          for index in range(13):
              path = root / ('chunk-%03d' % index)
              if path.is_symlink() or not path.is_file() or not 1 <= path.stat().st_size <= 12000: raise SystemExit(2)
              parts.append(path.read_bytes())
          encoded = b''.join(parts)
          if len(encoded) != 152100: raise SystemExit(2)
          packed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(packed).hexdigest() != 'ef5944156230bc9b23d409fe0de4b18c865cd401b99a62037b159bb2e313da75': raise SystemExit(2)
          inflater = zlib.decompressobj()
          raw = inflater.decompress(packed, 371452)
          if len(raw) != 371451 or not inflater.eof or inflater.unused_data or inflater.unconsumed_tail: raise SystemExit(2)
          if hashlib.sha256(raw).hexdigest() != 'b14d90ee435b20ba01cae4808525da8a096901c47c511ceef7cfadd62adda0c2': raise SystemExit(2)
          bundle = json.loads(raw)
          if set(bundle) != set(pins): raise SystemExit(2)
          verified = {}
          for name, pin in pins.items():
              item = bundle[name]
              if item.get('sha256') != pin: raise SystemExit(2)
              data = base64.b64decode(item['base64'], validate=True)
              if hashlib.sha256(data).hexdigest() != pin: raise SystemExit(2)
              verified[name] = data
          for name, data in verified.items():
              with (root / name).open('xb') as output: output.write(data)
          with (root / 'pins.json').open('x') as output: output.write(json.dumps(module_pins, sort_keys=True))
          STELLAR_RELEASE_PY
