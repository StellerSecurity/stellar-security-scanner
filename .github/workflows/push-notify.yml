# Compatibility entry point; organization webhooks deliver code push notifications.
name: Shared code push notification
on:
  workflow_call:
    secrets:
      PUSHOVER_APP_TOKEN:
        required: false
      PUSHOVER_USER_KEY:
        required: false
permissions: {}
jobs:
  notify:
    name: Notify about new code
    if: github.event.deleted == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record resolved shared scanner identity
        env:
          STELLAR_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          STELLAR_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          STELLAR_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          STELLAR_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        shell: bash
        run: |
          python3 -I -B - <<'STELLAR_SHARED_IDENTITY_PY'
          import json, os, re
          keys = ('REPOSITORY', 'REF', 'SHA', 'FILE_PATH')
          value = {key.lower(): os.environ.get('STELLAR_JOB_WORKFLOW_' + key, '') for key in keys}
          if value['repository'] != 'StellerSecurity/stellar-security-scanner': raise SystemExit(2)
          if value['ref'] != 'StellerSecurity/stellar-security-scanner/.github/workflows/push-notify.yml@refs/heads/main': raise SystemExit(2)
          if value['file_path'] != '.github/workflows/push-notify.yml': raise SystemExit(2)
          if not re.fullmatch(r'[0-9a-f]{40}', value['sha']) or value['sha'] == '0' * 40: raise SystemExit(2)
          repository = os.environ.get('GITHUB_REPOSITORY', '')
          if not re.fullmatch(r"(?:StellerSecurity|Stellar-seo-websites|StellarMail|StellarSecurity-Packages)/[A-Za-z0-9_.-]{1,100}", repository): raise SystemExit(2)
          if not re.fullmatch(r'[1-9][0-9]{0,19}', os.environ.get('GITHUB_REPOSITORY_ID', '')): raise SystemExit(2)
          value['caller_contract'] = 'stellar-shared-main-v1'
          print('STELLAR_SHARED_WORKFLOW_IDENTITY='+ json.dumps(value, sort_keys=True, separators=(',', ':')), flush=True)
          STELLAR_SHARED_IDENTITY_PY
      - name: Record central notification handoff
        shell: bash
        run: |
          python3 -I -B - <<'STELLAR_PUSH_HANDOFF_PY'
          import os
          message = (
              'Code-push notifications are handled by the central organization webhook. '
              'This compatibility workflow sends no notification and does not verify delivery. '
              'Malware and spyware scan workflows continue separately.'
          )
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('Code-push notification handoff\n\n' + message + '\n')
          STELLAR_PUSH_HANDOFF_PY
